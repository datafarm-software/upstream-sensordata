[package]
name = "upstream"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.14.9"
grpc = "0.9.0"
grpc-protobuf = "0.9.0"
protobuf = "3.7.2"
async-trait = "0.1.92"
prost = "0.14.5"
serde = { version = "1.0.229", features = ["derive"] }
tonic-prost = "0.14.9"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
reqwest = {version = "0.13.5", features = ["json"]}
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3.34"
prost-types = "0.14.6"
sea-orm = { version = "2.0.0", features = [ "sqlx-sqlite", "runtime-tokio", "macros" ] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
